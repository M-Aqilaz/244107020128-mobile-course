name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Flutter CI/CD (Test & Android Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Automated Tests & Coverage
        run: flutter test --coverage

      - name: Flutter Doctor Check
        run: flutter doctor -v

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Release)
        run: |
          set +e
          flutter build apk --release -v > build_apk.log 2>&1
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::--- BUILD APK FAILED (Exit Code $BUILD_STATUS) ---"
            grep -E "FAILURE:|What went wrong|Caused by:|e: |error:|FAILED|Exception" build_apk.log | tail -n 20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 20 build_apk.log | while IFS= read -r line; do
              echo "::error::LOG: $line"
            done
            exit $BUILD_STATUS
          fi

      - name: Build Android App Bundle (Release)
        run: flutter build appbundle --release

      - name: Upload Android Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_apk.log
          if-no-files-found: warn
