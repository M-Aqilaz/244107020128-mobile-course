name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Flutter CI/CD (Test & Android Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-week-13-ci-cd-automation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Automated Tests & Coverage
        run: flutter test --coverage

      - name: Flutter Doctor Check
        run: flutter doctor -v

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Release)
        run: |
          set +e
          flutter build apk --release -v 2>&1 | tee build_apk.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::flutter build apk failed with status $BUILD_STATUS"
            echo "==== LAST 100 LINES OF BUILD LOG ===="
            tail -n 100 build_apk.log
            exit $BUILD_STATUS
          fi

      - name: Build Android App Bundle (Release)
        run: flutter build appbundle --release

      - name: Upload Android Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            13-week-13-ci-cd-automation/build/app/outputs/flutter-apk/app-release.apk
            13-week-13-ci-cd-automation/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: 13-week-13-ci-cd-automation/build_apk.log
          if-no-files-found: warn

  verify-previous-milestones:
    name: Regression Verification (Week 8 & Week 12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Verify Week 8
        run: |
          cd 08-week-8-mid-project-review
          flutter pub get
          flutter test

      - name: Verify Week 12
        run: |
          cd 12-week-12-testing-quality-assurance
          flutter pub get
          flutter test
