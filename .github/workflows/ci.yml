name: ci

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  verify:
    name: Flutter Analyze & Test Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install Dependencies (Week 8)
        run: |
          cd 08-week-8-mid-project-review
          flutter pub get

      - name: Verify Code Formatting (Week 8)
        run: |
          cd 08-week-8-mid-project-review
          dart format --set-exit-if-changed lib test

      - name: Run Static Analysis (Week 8)
        run: |
          cd 08-week-8-mid-project-review
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Automated Tests (Week 8)
        run: |
          cd 08-week-8-mid-project-review
          flutter test

      - name: Install Dependencies (Week 12)
        run: |
          cd 12-week-12-testing-quality-assurance
          flutter pub get

      - name: Verify Code Formatting (Week 12)
        run: |
          cd 12-week-12-testing-quality-assurance
          dart format --set-exit-if-changed lib test

      - name: Run Static Analysis (Week 12)
        run: |
          cd 12-week-12-testing-quality-assurance
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Automated Tests (Week 12)
        run: |
          cd 12-week-12-testing-quality-assurance
          flutter test
